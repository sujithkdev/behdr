# Command intent classifier
# Keyword-scoring classifier that runs on all PowerShell/CMD/WScript processes
# Assigns human-readable intent labels

intent_classifier:
  thresholds:
    normal_admin: 0
    suspicious_activity: 25
    reconnaissance: 40
    lateral_movement: 60
    credential_access: 75
    ransomware_activity: 85
    critical_malware: 90
  
  keywords:
    # Normal admin (0-10 points each)
    normal:
      - pattern: "Get-Process"
        score: 5
      - pattern: "Get-Service"
        score: 5
      - pattern: "Test-Connection"
        score: 5
    
    # Reconnaissance (15-25 points each)
    reconnaissance:
      - pattern: "whoami"
        score: 15
      - pattern: "net user"
        score: 20
      - pattern: "net group"
        score: 20
      - pattern: "nltest"
        score: 25
      - pattern: "systeminfo"
        score: 15
      - pattern: "ipconfig /all"
        score: 15
      - pattern: "arp -a"
        score: 20
      - pattern: "net view"
        score: 20
      - pattern: "net share"
        score: 20
    
    # Suspicious execution (25-40 points each)
    suspicious_execution:
      - pattern: "IEX"
        score: 35
      - pattern: "Invoke-Expression"
        score: 35
      - pattern: "-enc"
        score: 30
      - pattern: "-EncodedCommand"
        score: 30
      - pattern: "bypass"
        score: 25
      - pattern: "-noprofile"
        score: 20
      - pattern: "-windowstyle hidden"
        score: 30
    
    # Lateral movement (40-60 points each)
    lateral_movement:
      - pattern: "psexec"
        score: 50
      - pattern: "wmic"
        score: 40
      - pattern: "Invoke-Command"
        score: 45
      - pattern: "Enter-PSSession"
        score: 45
      - pattern: "New-PSSession"
        score: 45
      - pattern: "winrm"
        score: 40
      - pattern: "net use"
        score: 35
    
    # Credential access (60-80 points each)
    credential_access:
      - pattern: "mimikatz"
        score: 80
      - pattern: "sekurlsa"
        score: 80
      - pattern: "logonpasswords"
        score: 80
      - pattern: "procdump"
        score: 70
      - pattern: "lsass"
        score: 75
      - pattern: "comsvcs.dll"
        score: 70
      - pattern: "MiniDump"
        score: 70
    
    # Ransomware activity (70-90 points each)
    ransomware_activity:
      - pattern: "vssadmin delete"
        score: 85
      - pattern: "wbadmin delete"
        score: 85
      - pattern: "bcdedit"
        score: 80
      - pattern: "shadowcopy delete"
        score: 85
      - pattern: "recoveryenabled no"
        score: 85
      - pattern: "cipher /w"
        score: 75
    
    # Critical malware (80-100 points each)
    critical_malware:
      - pattern: "DisableRealtimeMonitoring"
        score: 90
      - pattern: "DisableAntivirus"
        score: 90
      - pattern: "Set-MpPreference -DisableRealtimeMonitoring"
        score: 95
      - pattern: "Clear-EventLog"
        score: 85
      - pattern: "wevtutil cl"
        score: 85
