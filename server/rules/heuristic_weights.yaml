# L2 Heuristic Weighted Scoring — FP-hardened
#
# Design principles applied here:
#   1. Generic dev-tool signals (curl, wget, base64) are LOW score — alone they
#      mean nothing. They only matter when combined with other signals.
#   2. Encoding + obfuscation flags score higher when combined (additive).
#   3. Pattern matching is case-insensitive in the engine, but write patterns
#      in lower-case here for clarity.
#   4. long_cmdline and very_long_cmdline are mutually exclusive in the engine
#      (only the higher one fires) — avoid double-counting.
#   5. Parent→child pairs are scored by HOW unusual the parent is.
#      office→shell is far more suspicious than rundll32→shell.
#
# SCORE CAP POLICY (enforced in detector.py):
#   The combined L2 score is hard-capped at 84 before emitting.
#   Score 85+ (CRITICAL) requires either:
#     - L1 exact behaviour chain rule match (certain)
#     - L0 IOC/threat intel hit (certain)
#     - L8 process masquerading from wrong path (certain)
#   This prevents multiple stacked heuristic signals from generating
#   false CRITICAL alerts on unusual-but-legitimate admin scripts.
#
#   Maximum realistic L2-only score before cap:
#     IEX cradle (55) + office parent (40) + suspicious path (18)
#     + very long cmdline (22) = 135 → capped to 84 = HIGH
#   This is correct: office→IEX from Temp IS high confidence malware,
#   but CRITICAL requires L1 confirmation or IOC match.

weights:

  # ── Cmdline flags ──────────────────────────────────────────────────────────
  # Scored by how exclusively malicious each pattern is in practice.
  cmdline_flags:

    # HIGH confidence — almost never in legitimate scripts
    - pattern: "iex(new-object"
      score: 55
      description: "IEX cradle — download and execute pattern"
    - pattern: "invoke-expression (new-object"
      score: 55
      description: "IEX cradle (verbose form)"
    - pattern: "amsiutils"
      score: 55
      description: "AMSI bypass attempt"
    - pattern: "amsiscanbuffer"
      score: 55
      description: "AMSI bypass (direct buffer patch)"
    - pattern: "certutil -urlcache"
      score: 55
      description: "certutil download abuse"
    - pattern: "bitsadmin /transfer"
      score: 50
      description: "bitsadmin download abuse"
    - pattern: "frombase64string"
      score: 40
      description: "Base64 decode — payload deobfuscation"

    # MEDIUM confidence — suspicious but seen in some admin scripts
    - pattern: "-encodedcommand"
      score: 35
      description: "Encoded PowerShell command"
    - pattern: "-enc "
      score: 30
      description: "Encoded PowerShell (short flag) — requires trailing space"
    - pattern: "-windowstyle hidden"
      score: 30
      description: "Hidden window execution"
    - pattern: "-w hidden"
      score: 30
      description: "Hidden window (short form)"
    - pattern: "downloadstring("
      score: 35
      description: "PowerShell web download cradle"
    - pattern: "downloadfile("
      score: 35
      description: "PowerShell file download"

    # LOW confidence — only meaningful when combined with other signals
    # These are all used routinely by npm/pip/dev scripts — DO NOT raise scores
    - pattern: "invoke-webrequest"
      score: 12
      description: "Web request — common in dev scripts and package managers"
    - pattern: "bypass"
      score: 12
      description: "Execution policy bypass — common in dev/CI environments"
    - pattern: "-nop"
      score: 8
      description: "No-profile flag — used by VS Code, CI runners, admin scripts"
    - pattern: "-noprofile"
      score: 8
      description: "No-profile flag"
    - pattern: "webclient"
      score: 10
      description: "WebClient — common in automation scripts"
    - pattern: "wget"
      score: 8
      description: "wget — standard dev/ops tool"
    - pattern: "curl"
      score: 8
      description: "curl — extremely common in CI/CD pipelines"
    - pattern: "base64"
      score: 8
      description: "Base64 — used in many dev scripts for encoding config"
    - pattern: "invoke-expression"
      score: 15
      description: "IEX without download cradle (common in module loaders)"
    - pattern: "set-executionpolicy"
      score: 12
      description: "Execution policy change — common in dev environment setup"

  # ── Parent → child pairs ──────────────────────────────────────────────────
  # Score based on how legitimate the parent→child relationship could be.
  # Office apps spawning shells: always suspicious (score 40).
  # LOLBins spawning shells: suspicious but msiexec/svchost do it legitimately (score 30).
  # Browsers spawning shells: unusual but can happen via extensions (score 25).
  parent_child_pairs:

    - parent: ["winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "acrord32.exe"]
      child:  ["powershell.exe", "pwsh.exe", "cmd.exe", "wscript.exe", "cscript.exe"]
      score: 40
      description: "Office application spawning a shell — macro/phishing indicator"

    - parent: ["mshta.exe", "regsvr32.exe"]
      child:  ["powershell.exe", "pwsh.exe", "cmd.exe"]
      score: 35
      description: "Script proxy binary spawning shell"

    - parent: ["rundll32.exe"]
      child:  ["powershell.exe", "pwsh.exe", "cmd.exe"]
      score: 28
      description: "Rundll32 spawning shell (also used by some MSI installers)"

    # Browsers only score when combined with cmdline indicators
    # Alone they are low-confidence — Chrome launching cmd for PWA installs is normal
    - parent: ["chrome.exe", "firefox.exe", "msedge.exe", "iexplore.exe", "brave.exe"]
      child:  ["powershell.exe", "pwsh.exe", "cmd.exe"]
      score: 20
      description: "Browser spawning shell (low alone — check cmdline too)"

  # ── Execution patterns ────────────────────────────────────────────────────
  execution_patterns:

    - name: "suspicious_path"
      paths:
        - "\\AppData\\Local\\Temp\\"
        - "\\Users\\Public\\"
        - "C:\\Windows\\Temp\\"
        - "C:\\Temp\\"
        # ProgramData is used by many legit installers — lower threshold applied
      score: 18
      description: "Execution from a user-writable temp/public directory"

    # Only one of long_cmdline / very_long_cmdline fires (engine picks the highest)
    - name: "long_cmdline"
      threshold: 600
      score: 12
      description: "Long command line (>600 chars) — possible obfuscation"

    - name: "very_long_cmdline"
      threshold: 1200
      score: 22
      description: "Very long command line (>1200 chars) — strong obfuscation signal"

    - name: "orphan_process"
      parent: "unknown"
      score: 15
      description: "No known parent — possible process hollowing or injection"

  # ── Behavioral indicators (set by L6/L7, not cmdline) ────────────────────
  # These are not checked by _l2_heuristic() — they are applied by L6/L7 directly.
  # Listed here for documentation and dashboard display purposes only.
  behavioral:
    - name: "mass_file_modification"
      score: 90
      description: "Mass file modification (>50 files/2 min) — ransomware indicator"
    - name: "ransom_note_creation"
      score: 80
      description: "Ransom note file created (README_DECRYPT, HOW_TO_RECOVER etc.)"
    - name: "encrypted_extension"
      score: 85
      description: "Files renamed to .encrypted / .locked / .crypto"
    - name: "c2_beaconing"
      score: 70
      description: "Regular periodic outbound connections — C2 beaconing pattern"
    - name: "lateral_movement_port"
      score: 80
      description: "Connection to SMB/RDP/WinRM port from unexpected process"
