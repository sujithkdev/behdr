    child: "smss.exe"
    description: "Session manager"
  - parent: "smss.exe"
    child: "csrss.exe"
    description: "Client/server runtime"
  - parent: "smss.exe"
    child: "wininit.exe"
    description: "Windows initialization"
  - parent: "smss.exe"
    child: "winlogon.exe"
    description: "Windows logon"
  - parent: "wininit.exe"
    child: "services.exe"
    description: "Service control manager"
  - parent: "wininit.exe"
    child: "lsass.exe"
    description: "Local security authority"
  - parent: "wininit.exe"
    child: "lsm.exe"
    description: "Local session manager"
  - parent: "winlogon.exe"
    child: "userinit.exe"
    description: "User initialization"
  - parent: "winlogon.exe"
    child: "dwm.exe"
    description: "Desktop window manager"
  - parent: "winlogon.exe"
    child: "fontdrvhost.exe"
    description: "Font driver host"
  - parent: "userinit.exe"
    child: "explorer.exe"
    description: "Shell startup"

  # ── Services / svchost ────────────────────────────────────────────────────
