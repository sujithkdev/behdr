# L3 Parent-Child Process Analysis — FP-hardened
#
# Safe pairs checked FIRST — if matched, score = 0 and no further checks.
# System exceptions applied second.
# Suspicious pairs scored last — only if no safe pair matched.
#
# Key additions vs original:
#   - Massive expansion of safe_pairs covering IT tools, security software,
#     software deployment, and common Windows Update patterns
#   - Browser→cmd is NOT suspicious alone (PWA installs, Electron apps)
#   - svchost/services spawning shells is NOT suspicious (Windows Update, DISM)
#   - Code editors spawning shells is NOT suspicious (VS Code, JetBrains)

# ── Suspicious pairs ─────────────────────────────────────────────────────────
suspicious_pairs:

  # Office spawning shells — always suspicious
  - parent: "winword.exe"
    child: "powershell.exe"
    score: 40
    description: "Word spawning PowerShell — macro malware indicator"
    mitre: "T1566.001"

  - parent: "winword.exe"
    child: "cmd.exe"
    score: 40
    description: "Word spawning CMD"
    mitre: "T1566.001"

  - parent: "winword.exe"
    child: "wscript.exe"
    score: 40
    description: "Word spawning WScript"
    mitre: "T1566.001"

  - parent: "winword.exe"
    child: "mshta.exe"
    score: 40
    description: "Word spawning MSHTA"
    mitre: "T1566.001"

  - parent: "excel.exe"
    child: "powershell.exe"
    score: 40
    description: "Excel spawning PowerShell"
    mitre: "T1566.001"

  - parent: "excel.exe"
    child: "cmd.exe"
    score: 40
    description: "Excel spawning CMD"
    mitre: "T1566.001"

  - parent: "excel.exe"
    child: "wscript.exe"
    score: 40
    description: "Excel spawning WScript"
    mitre: "T1566.001"

  - parent: "outlook.exe"
    child: "powershell.exe"
    score: 40
    description: "Outlook spawning PowerShell"
    mitre: "T1566.001"

  - parent: "outlook.exe"
    child: "cmd.exe"
    score: 40
    description: "Outlook spawning CMD"
    mitre: "T1566.001"

  - parent: "powerpnt.exe"
    child: "powershell.exe"
    score: 40
    description: "PowerPoint spawning PowerShell"
    mitre: "T1566.001"

  - parent: "acrord32.exe"
    child: "powershell.exe"
    score: 40
    description: "Acrobat spawning PowerShell — PDF exploit"
    mitre: "T1189"

  - parent: "acrord32.exe"
    child: "cmd.exe"
    score: 40
    description: "Acrobat spawning CMD"
    mitre: "T1189"

  # Script proxy LOLBins spawning shells
  - parent: "mshta.exe"
    child: "powershell.exe"
    score: 40
    description: "MSHTA spawning PowerShell"
    mitre: "T1218.005"

  - parent: "mshta.exe"
    child: "cmd.exe"
    score: 40
    description: "MSHTA spawning CMD"
    mitre: "T1218.005"

  - parent: "regsvr32.exe"
    child: "powershell.exe"
    score: 38
    description: "Regsvr32 spawning PowerShell — Squiblydoo technique"
    mitre: "T1218.010"

  # rundll32 is lower confidence — Windows internally uses it for shell extensions
  - parent: "rundll32.exe"
    child: "powershell.exe"
    score: 25
    description: "Rundll32 spawning PowerShell (check cmdline for confirmation)"
    mitre: "T1218.011"

  # Browsers: only score if cmdline indicators present (engine adds L2 score)
  - parent: "chrome.exe"
    child: "powershell.exe"
    score: 20
    description: "Chrome spawning PowerShell — low alone, check cmdline"
    mitre: "T1189"

  - parent: "firefox.exe"
    child: "powershell.exe"
    score: 20
    description: "Firefox spawning PowerShell"
    mitre: "T1189"

  - parent: "msedge.exe"
    child: "powershell.exe"
    score: 20
    description: "Edge spawning PowerShell"
    mitre: "T1189"

  - parent: "iexplore.exe"
    child: "powershell.exe"
    score: 30
    description: "Internet Explorer spawning PowerShell"
    mitre: "T1189"

  - parent: "iexplore.exe"
    child: "cmd.exe"
    score: 30
    description: "Internet Explorer spawning CMD"
    mitre: "T1189"

# ── Safe pairs — never alert regardless of cmdline ────────────────────────────
# The more entries here, the fewer false positives.
safe_pairs:

  # ── Windows boot chain ────────────────────────────────────────────────────
