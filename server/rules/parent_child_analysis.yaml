# ── System user exceptions ────────────────────────────────────────────────────
# When user context is SYSTEM, cmd/PS from service parents is routine automation.
# Max score cap prevents these from reaching alert threshold alone.
system_user_exceptions:

  - user: "SYSTEM"
    child: "cmd.exe"
    parent: ["services.exe", "svchost.exe", "taskeng.exe", "taskhostw.exe",
             "trustedinstaller.exe", "tiworker.exe", "msiexec.exe"]
    max_score: 15
    description: "SYSTEM service spawning CMD — Windows maintenance automation"

  - user: "SYSTEM"
    child: "powershell.exe"
    parent: ["services.exe", "svchost.exe", "taskeng.exe", "taskhostw.exe",
             "trustedinstaller.exe", "tiworker.exe", "msiexec.exe", "ccmexec.exe"]
    max_score: 15
    description: "SYSTEM service spawning PowerShell — Windows maintenance automation"

  - user: "SYSTEM"
    child: "pwsh.exe"
    parent: ["services.exe", "svchost.exe", "taskeng.exe", "taskhostw.exe"]
    max_score: 15
    description: "SYSTEM service spawning PowerShell 7"
